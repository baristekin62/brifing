<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Yeni Şifre — ÖZEN Brifing Paneli</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
<div class="login-card">
  <div class="login-brand">
    <span class="brand-dot"></span>
    <h1>Yeni Şifre Belirleyin</h1>
    <p>Hesabınız için yeni şifre oluşturun</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash flash-{{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="post">
    <label>Yeni Şifre</label>
    <input type="password" name="new_password" required autofocus autocomplete="new-password">
    <label>Yeni Şifre (Tekrar)</label>
    <input type="password" name="new_password2" required autocomplete="new-password">
    <button type="submit">Şifreyi Kaydet</button>
  </form>
</div>
</body>
</html>
